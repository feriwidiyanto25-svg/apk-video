name: Render Shorts/Reels Video Job

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'GitHub Release Tag / Job ID (e.g. job-1730000000)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Setup FFmpeg & Fonts
        run: |
          if ! command -v ffmpeg &> /dev/null; then
            echo "[SETUP] FFmpeg not found, installing..."
            sudo apt-get update -o Acquire::Retries=2 -o Acquire::http::Timeout="10"
            sudo apt-get install -y --no-install-recommends ffmpeg fontconfig
          else
            echo "[SETUP] FFmpeg already pre-installed: $(ffmpeg -version | head -n 1)"
          fi
          mkdir -p ~/.local/share/fonts
          cp fonts/*.ttf ~/.local/share/fonts/ || true
          fc-cache ~/.local/share/fonts/ || true

      - name: Install Python Dependencies
        run: |
          pip install -r engine/requirements.txt

      - name: Execute Video Render Engine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python engine/render_engine.py --job-id "${{ github.event.inputs.job_id }}"
