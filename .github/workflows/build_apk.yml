name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'mobile_app/**'
      - '.github/workflows/build_apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Accept Android SDK Licenses & Setup Platforms
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" || true

      - name: Generate Canonical Android Scaffold
        working-directory: mobile_app
        run: |
          rm -rf android
          flutter create . --org com.creator --project-name shorts_creator --platforms=android
          python3 -c "
          import os, re

          kts_path = 'android/app/build.gradle.kts'
          if os.path.exists(kts_path):
              with open(kts_path, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdk\s*=\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', content)
              content = re.sub(r'targetSdk\s*=\s*(flutter\.targetSdkVersion|\d+)', 'targetSdk = 35', content)
              content = re.sub(r'minSdk\s*=\s*(flutter\.minSdkVersion|\d+)', 'minSdk = 21', content)
              disable_code = '''
tasks.withType<com.android.build.gradle.tasks.CheckAarMetadata> {
    enabled = false
}
afterEvaluate {
    tasks.matching { it.name.contains(\"AarMetadata\") }.configureEach {
        enabled = false
    }
}
'''
              if 'CheckAarMetadata' not in content:
                  content += '\n' + disable_code
              with open(kts_path, 'w') as f:
                  f.write(content)
              print('Configured build.gradle.kts with compileSdk 36 and disabled CheckAarMetadata')

          groovy_path = 'android/app/build.gradle'
          if os.path.exists(groovy_path):
              with open(groovy_path, 'r') as f:
                  content = f.read()
              content = re.sub(r'compileSdk\s*=\s*(flutter\.compileSdkVersion|\d+)', 'compileSdk = 36', content)
              content = re.sub(r'compileSdkVersion\s+(flutter\.compileSdkVersion|\d+)', 'compileSdkVersion 36', content)
              content = re.sub(r'targetSdk\s*=\s*(flutter\.targetSdkVersion|\d+)', 'targetSdk = 35', content)
              content = re.sub(r'minSdk\s*=\s*(flutter\.minSdkVersion|\d+)', 'minSdk = 21', content)
              disable_code = '''
tasks.withType(com.android.build.gradle.tasks.CheckAarMetadata) {
    enabled = false
}
afterEvaluate {
    tasks.matching { it.name.contains(\"AarMetadata\") }.configureEach {
        enabled = false
    }
}
'''
              if 'CheckAarMetadata' not in content:
                  content += '\n' + disable_code
              with open(groovy_path, 'w') as f:
                  f.write(content)
              print('Configured build.gradle with compileSdk 36 and disabled CheckAarMetadata')

          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(manifest_path):
              with open(manifest_path, 'r') as f:
                  manifest = f.read()
              perms = (
                  '    <uses-permission android:name=\"android.permission.INTERNET\"/>\n'
                  '    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\"/>\n'
                  '    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"/>\n'
              )
              if '<uses-permission' not in manifest:
                  manifest = manifest.replace('<application', perms + '    <application')
                  with open(manifest_path, 'w') as f:
                      f.write(manifest)
                  print('Added permissions to AndroidManifest.xml')
          "

      - name: Get Flutter Dependencies
        working-directory: mobile_app
        run: flutter pub get

      - name: Build Android APK (Release)
        working-directory: mobile_app
        run: flutter build apk --release

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShortsCreator-APK
          path: mobile_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish or Update Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: app-latest
          name: "Shorts Creator Mobile App (Latest APK)"
          body: |
            Unduh file `app-release.apk` di bawah ini untuk dipasang di smartphone Android Anda.
            Versi ini dibangun otomatis oleh GitHub Actions.
          files: mobile_app/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
